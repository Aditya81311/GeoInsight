version: "3.8"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: geoinsight
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    depends_on:
      - db
    environment:
      DATABASE_URL: sqlite:///./geoinsight.db
      # To use Postgres instead, set the value to: postgresql://postgres:postgres@db:5432/geoinsight
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/data:/app/data

volumes:
  db_data:
